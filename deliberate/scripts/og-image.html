<!doctype html>
<!-- Source for public/og-image.png, the link-preview image. Open in a browser at 1200×630 and
     screenshot it to update. Keep the subject count in sync with index.html's meta tags. -->
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" />
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; background: #f3f5f9; font-family: 'IBM Plex Sans', sans-serif; color: #141a2a; }
  .card { position: absolute; inset: 0; padding: 64px 72px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .logo { width: 64px; height: 64px; border-radius: 16px; background: #3056d3; color: #fff; display: grid; place-items: center; font: 800 38px 'Bricolage Grotesque', sans-serif; }
  .name { font: 800 44px 'Bricolage Grotesque', sans-serif; letter-spacing: -0.01em; }
  h1 { margin-top: 44px; font: 800 64px/1.08 'Bricolage Grotesque', sans-serif; letter-spacing: -0.02em; max-width: 960px; }
  p { margin-top: 18px; font-size: 28px; color: #4a5468; }
  .chips { margin-top: auto; display: flex; flex-wrap: wrap; gap: 12px; }
  .chip { display: flex; align-items: center; gap: 10px; padding: 10px 18px; border-radius: 999px; background: #fff; border: 1px solid #dde2ec; font-size: 22px; font-weight: 500; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand"><div class="logo">D</div><div class="name">Deliberate</div></div>
    <h1>Learn the skills that help in work and life</h1>
    <p>18 subjects · bite-sized lessons, quizzes, flashcards and daily drills</p>
    <div class="chips">
      <span class="chip"><span class="dot" style="background:#4d7c0f"></span>Learning and thinking</span>
      <span class="chip"><span class="dot" style="background:#c2410c"></span>Focus and habits</span>
      <span class="chip"><span class="dot" style="background:#b91c1c"></span>Health and wellbeing</span>
      <span class="chip"><span class="dot" style="background:#be185d"></span>Working with people</span>
      <span class="chip"><span class="dot" style="background:#047857"></span>Money and business</span>
      <span class="chip"><span class="dot" style="background:#3056d3"></span>Career and tech</span>
    </div>
  </div>
</body>
</html>
